name: Pull Request Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backpack
          POSTGRES_PASSWORD: backpack
          POSTGRES_DB: backpack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backpack -d backpack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://backpack:backpack@127.0.0.1:5432/backpack
      AUTH_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_WEB_SERVER: "1"
      MOBILE_TEST_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - name: Prepare ephemeral test authentication
        shell: bash
        run: |
          e2e_password="$(openssl rand -hex 32)"
          auth_secret="$(openssl rand -hex 32)"
          e2e_password_hash="$(printf %s "$e2e_password" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$e2e_password"
          echo "::add-mask::$auth_secret"
          {
            echo "E2E_TEST_PASSWORD=$e2e_password"
            echo "AUTH_E2E_PASSWORD_HASH=$e2e_password_hash"
            echo "AUTH_SECRET=$auth_secret"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run db:migrate
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - run: npm run test:workflow

      - name: Upload workflow test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-test-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ARM64 runtime image
        run: docker buildx build --platform linux/arm64 --tag strider:pr-check --load .
