name: Release Strider Desktop

# Push a tag `desktop-v<version>` whose version matches desktop/crates/strider-app/Cargo.toml.
# The workflow tests the desktop workspace, builds Strider.app on Apple silicon, writes the
# ed25519-signed manifest, and publishes both as the GitHub release (marked latest), which is
# where installed apps look for updates.
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/strider-app/Cargo.toml | head -1)
          if [[ "$GITHUB_REF_NAME" != "desktop-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match strider-app version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Test
        run: cargo test --locked --workspace

      - name: Build, sign and write the manifest
        env:
          STRIDER_UPDATE_SIGNING_KEY: ${{ secrets.STRIDER_UPDATE_SIGNING_KEY }}
          STRIDER_RELEASE_NOTES: Strider Desktop ${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          : "${STRIDER_UPDATE_SIGNING_KEY:?Missing the STRIDER_UPDATE_SIGNING_KEY secret}"
          cargo xtask release
          test -f "target/release-artifacts/Strider-$VERSION.zip"
          test -f target/release-artifacts/manifest.json

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd target/release-artifacts
          sha=$(shasum -a 256 "Strider-$VERSION.zip" | cut -d' ' -f1)
          notes="Strider Desktop $VERSION for macOS 13 or later on Apple silicon.

          Install: unzip, move Strider.app to Applications. Until builds are notarized, right-click the app and choose Open the first time. Installed apps update themselves from this release.

          SHA-256 of the zip: \`$sha\`"
          gh release create "$GITHUB_REF_NAME" "Strider-$VERSION.zip" manifest.json \
            --repo "$GITHUB_REPOSITORY" --title "Strider Desktop $VERSION" --notes "$notes" --latest
