[package]
name = "strider-app"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "strider"
path = "src/main.rs"

[dependencies]
strider-sync = { path = "../strider-sync" }
strider-core = { path = "../strider-core" }
strider-store = { path = "../strider-store" }
strider-ui = { path = "../strider-ui" }
gpui.workspace = true
gpui-component.workspace = true
gpui_platform.workspace = true

rusqlite.workspace = true
serde_json.workspace = true
strider-map = { path = "../strider-map" }
strider-print = { path = "../strider-print" }
strider-services = { path = "../strider-services" }
strider-update = { path = "../strider-update" }
strider-devices = { path = "../strider-devices" }
chrono.workspace = true

[dev-dependencies]
strider-devices = { path = "../strider-devices", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
