[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# gpui-component 0.9.1 is built on gpui-pre 0.3.12. Pin both exactly and upgrade together.
gpui = { package = "gpui-pre", version = "=0.3.12" }
# runtime_shaders: compile Metal shaders at launch, so builds need only the Command Line Tools, not Xcode.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["runtime_shaders", "font-kit"] }
gpui-component = "=0.9.1"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
uuid = { version = "=1.29.0", features = ["v7"] }
# Sync client (milestone 2b). Pinned to versions already in the lock file where possible.
ureq = { version = "=3.5.0", features = ["json"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
rand = "=0.9.5"
url = "=2.5.8"
security-framework = "=3.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
regex = "=1.13.1"
# Calendar feeds (milestone 4a).
rrule = "=0.14.0"
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
